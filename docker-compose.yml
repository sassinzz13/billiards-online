# Development stack: traefik, web, server, postgres.
#
# Routing is PATH-BASED on a single host rather than split across subdomains:
#
#   ${PUBLIC_HOST}/          -> web     (Angular)
#   ${PUBLIC_HOST}/api/...   -> server
#   ${PUBLIC_HOST}/ws        -> server  (from Phase 5)
#
# One host means one origin, which is what lets the session cookie work with no `Domain` attribute,
# keeps SameSite=Lax fully effective, and removes CORS from the system entirely. See ADR 0009.
#
#   make up      start everything
#   make logs    follow
#   make down    stop

name: billiards

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    # No `command`: the whole static configuration lives in traefik.yml, so there is one place to
    # look. The production overlay overrides it with flags instead.
    ports:
      - "80:80"
      - "127.0.0.1:8081:8080"   # dashboard, loopback only
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Read-only socket access. Traefik only needs to watch container events.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [billiards]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Deterministic collation, so ORDER BY does not depend on the host's locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      # PostgreSQL 18+ images expect the mount at /var/lib/postgresql, not .../data. The image
      # places version-specific subdirectories underneath, which is what makes `pg_upgrade --link`
      # possible without crossing a mount boundary. Mounting .../data makes the container refuse
      # to start.
      - pgdata:/var/lib/postgresql
    ports:
      # Published on loopback only, so psql and integration tests work from the host without
      # exposing the database to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [billiards]
    healthcheck:
      # -d and -U matter: without them pg_isready reports ready during initdb, and the server
      # would start against a database that is not actually accepting connections yet.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      HTTP_INTERNAL_ADDR: "0.0.0.0:6060"
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://billiards.localhost}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15s}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      # pprof, loopback only and never routed through Traefik. `go tool pprof
      # http://localhost:6060/debug/pprof/heap` works from the host.
      - "127.0.0.1:6060:6060"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [billiards]
    healthcheck:
      # The image is FROM scratch, so there is no shell and no curl. The binary probes itself.
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${PUBLIC_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`))
      - traefik.http.routers.api.entrypoints=web
      # Higher priority than the web catch-all below, so /api and /ws are matched first.
      - traefik.http.routers.api.priority=10
      - traefik.http.services.api.loadbalancer.server.port=8080

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    networks: [billiards]
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves localhost to ::1 first, so a name-based
      # probe reports a healthy nginx as unreachable.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      # Catch-all for the host. Priority 1 loses to the API router above.
      - traefik.http.routers.web.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=80

  # One-shot migration runner. Not started by `make up`; invoked by the migrate targets.
  #   docker compose run --rm migrate up
  migrate:
    image: migrate/migrate:v4.19.1
    profiles: [tools]
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [billiards]

volumes:
  pgdata:

networks:
  billiards:
    # Explicit name so it matches `providers.docker.network` in traefik.yml, which does not see
    # Compose's project-name prefix.
    name: billiards
