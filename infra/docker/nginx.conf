# nginx serves the built Angular bundle only.
#
# It never proxies /api or /ws. Traefik routes those straight to the server container, so there is
# one routing layer rather than two, and nginx has no knowledge of the backend at all.

server {
    listen 80;
    # The container resolves "localhost" to ::1 first, so an IPv4-only listener makes any probe
    # using the name fail with connection refused while the service is perfectly healthy.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artifacts are immutable, so they can be cached indefinitely.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|glb|ktx2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current hashed bundles, so a stale
    # copy pins the browser to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: the Angular router owns client-side paths, so unknown paths return the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defence in depth. Traefik sets these too, but this container should be safe if ever exposed
    # directly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log off;
}
